  <script>
    /* Apply the theme before first paint to avoid a flash. A saved choice
       from the settings menu wins; otherwise follow the system setting. */
    try {
      var savedTheme = localStorage.getItem('theme');
    } catch (e) {}
    if (savedTheme === 'light' || (savedTheme !== 'dark' &&
        window.matchMedia('(prefers-color-scheme: light)').matches)) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
    /* Flag the intro reveal pre-paint so the text never flashes unsplit.
       Skipped for reduced motion: stagger delays would survive the global
       duration override and letters would pop in one by one. */
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('anim-intro');
    }
    /* Archive layout (vertical | horizontal) also lands pre-paint: the
       two views are laid out completely differently (one scrolls, one is
       a locked single screen), so resolving it after first paint would
       flash. Vertical is the default; only a deviation is stored. */
    var savedLayout;
    try {
      savedLayout = localStorage.getItem('layout');
    } catch (e) {}
    document.documentElement.setAttribute(
      'data-layout', savedLayout === 'horizontal' ? 'horizontal' : 'vertical');
  </script>
